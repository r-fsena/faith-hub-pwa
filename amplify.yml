version: 1
frontend:
  phases:
    preBuild:
      commands:
        - node scripts/verify-production-release.cjs
        - node scripts/check-dependency-policy.cjs
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
