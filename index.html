<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo-symbol.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    
    <link rel="stylesheet" href="/pwa-boot.css?v=20261109-rounded-logo" />

    <!-- PWA Settings -->
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <title>Faith-Hub • Aplicativo Oficial</title>
  </head>
  <body style="margin: 0; background: #090d16; overflow-x: hidden;">
    <div id="initial-splash" role="status" aria-live="polite" aria-label="Carregamento do aplicativo">
      <img hidden alt="" />
      <h1>Carregando sua igreja…</h1>
      <p>Preparando seu aplicativo</p>
      <div class="boot-spinner" aria-hidden="true"></div>
      <button type="button" hidden>Tentar novamente</button>
    </div>
    <div id="root" inert aria-hidden="true"></div>
    <script src="/pwa-boot.js?v=20261108-dark-default"></script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          if (isDev) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              for (const reg of regs) { reg.unregister(); }
            });
          } else {
            navigator.serviceWorker.register('/sw.js').then(reg => {
              reg.update();
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            }).catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });

            // The first claim needs no reload: this document already came from the network.
            const hadControllerAtLoad = Boolean(navigator.serviceWorker.controller);
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
              if (hadControllerAtLoad && !refreshing) {
                refreshing = true;
                window.location.reload();
              }
            });
          }
        });
      }
    </script>
  </body>
</html>
