<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo-symbol.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Faith-Hub" />
    <link rel="apple-touch-icon" href="/brand/logo-symbol.png" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet">

    <title>Faith-Hub • Aplicativo Oficial</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
          if (isDev) {
            // Em desenvolvimento local, desregistra qualquer service worker antigo para evitar tela branca
            navigator.serviceWorker.getRegistrations().then(regs => {
              for (const reg of regs) { reg.unregister(); }
            });
          } else {
            navigator.serviceWorker.register('/sw.js').catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
          }
        });
      }
    </script>
  </body>
</html>
